# Example configuration for goprotect
input: input.bc
output: output.bc

functions:
  allow: []   # empty means all
  deny: []

passes:
  entry_exit: true
  const_split: true
  cf_flatten: true
  instr_substitute: true
  const_obfuscation: true
  virtualization: false
  security_hooks: true

obfuscation:
  level: medium
  substitute_intensity: 2
  flatten_ratio: 50
  virtualize_ratio: 10

vmp:
  enable_multi_vm: true
  vms:
    - {name: vm_a, isa: A}
    - {name: vm_b, isa: B}
  levels:
    normal: vm_a
    sensitive: vm_b
    critical: vm_b
    function_vm: {}
    sensitive_list: []
    critical_list: []
  # 字节码 XOR 加密的静态密钥片段。留空（或删除本行）= 0x5A，与 C 运行时
  # 缺省一致（推荐）。显式设置时，应用侧必须在启动早期调用
  # goprotect_set_static_key(<值的末字节>) 注册同一值，否则字节码无法解密
  # ——契约详见 docs/goprotect.md「主要能力」。
  static_key: ""
  runtime_key_hint: ${GOPROTECT_RUNTIME_KEY_HINT}

report:
  path: dist/goprotect-report.json

debug:
  dump_cfg: false

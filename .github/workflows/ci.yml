name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Basic e2e (protector pipeline without Android tools)
        run: bash scripts/e2e-basic.sh

  runtime:
    name: C runtime checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax-check runtime sources (-Wall -Wextra -Werror)
        run: |
          for f in runtime/src/*.c; do
            clang -fsyntax-only -std=c11 -Wall -Wextra -Werror -I runtime/include "$f"
          done

      - name: VM interpreter unit tests
        run: |
          clang -std=c11 -Wall -Wextra -Werror -I runtime/include \
            runtime/tests/test_vm.c -o /tmp/test_vm && /tmp/test_vm

      - name: String-decrypt unit tests (P2.2)
        run: |
          clang -std=c11 -Wall -Wextra -Werror -I runtime/include \
            runtime/tests/test_hooks.c -o /tmp/test_hooks && /tmp/test_hooks

  llvm:
    name: LLVM native build (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install LLVM dev + runtime
        run: sudo apt-get update && sudo apt-get install -y llvm-18-dev llvm-18-runtime graphviz

      - name: Build llvmwrap with -tags llvm
        run: |
          PC_DIR=$(dirname "$(find /usr/lib/llvm-* -name llvm.pc | head -1)")
          echo "using pkgconfig dir: $PC_DIR"
          PKG_CONFIG_PATH="$PC_DIR" CGO_ENABLED=1 go build -tags llvm ./llvmwrap/ ./cmd/goprotect

      - name: LLVM-tagged integration tests (P4.2)
        run: |
          PC_DIR=$(dirname "$(find /usr/lib/llvm-* -name llvm.pc | head -1)")
          # Runtime object so lli can resolve VM entry/hook symbols in
          # post-pipeline semantic runs.
          clang -std=c11 -O1 -I runtime/include -c runtime/src/vm_entry.c -o /tmp/gp_vm_entry.o
          for f in hooks integrity antidebug; do
            clang -std=c11 -O1 -I runtime/include -c "runtime/src/$f.c" -o "/tmp/gp_$f.o"
          done
          ld -r /tmp/gp_vm_entry.o /tmp/gp_hooks.o /tmp/gp_integrity.o /tmp/gp_antidebug.o -o /tmp/goprotect_runtime.o
          # lli from llvm-18-runtime is suffixed; expose it under the plain name.
          LLI_BIN=$(command -v lli || command -v lli-18 || true)
          if [ -n "$LLI_BIN" ] && [ "$(basename "$LLI_BIN")" != "lli" ]; then
            sudo ln -sf "$LLI_BIN" /usr/local/bin/lli
          fi
          PATH="$PATH:/usr/lib/llvm-18/bin" \
            GOPROTECT_TEST_RUNTIME_OBJ=/tmp/goprotect_runtime.o \
            PKG_CONFIG_PATH="$PC_DIR" CGO_ENABLED=1 \
            go test -tags llvm ./llvmwrap/... ./passes/...

      - name: Validate dump-cfg DOT output renders (P2.4)
        run: |
          PC_DIR=$(dirname "$(find /usr/lib/llvm-* -name llvm.pc | head -1)")
          mkdir -p /tmp/dotcheck && cp passes/testdata/branchy.ll /tmp/dotcheck/
          PKG_CONFIG_PATH="$PC_DIR" CGO_ENABLED=1 \
            go build -tags llvm -o /tmp/goprotect ./cmd/goprotect
          /tmp/goprotect -input /tmp/dotcheck/branchy.ll -dump-cfg \
            -o /tmp/dotcheck/out.bc > /dev/null
          for f in /tmp/dotcheck/dump-cfg-before.dot /tmp/dotcheck/dump-cfg-after.dot; do
            dot -Tsvg "$f" -o "$f.svg"
            test -s "$f.svg"
          done
          echo "DOT graphs rendered OK"

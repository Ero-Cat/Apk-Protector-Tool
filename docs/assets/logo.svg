<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Apk-Protector-Tool logo">
  <defs>
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ADD8"/>
      <stop offset="1" stop-color="#3DDC84"/>
    </linearGradient>
    <linearGradient id="keyhole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BE7FF"/>
      <stop offset="1" stop-color="#7DF2C0"/>
    </linearGradient>
  </defs>

  <!-- dark rounded tile -->
  <rect x="8" y="8" width="224" height="224" rx="52" fill="#0D1220"/>

  <!-- circuit traces -->
  <g stroke="#2A3550" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 20 78 H 52"/>
    <path d="M 20 120 H 40"/>
    <path d="M 20 162 H 52"/>
    <path d="M 220 78 H 188"/>
    <path d="M 220 120 H 200"/>
    <path d="M 220 162 H 188"/>
    <path d="M 70 224 V 196"/>
    <path d="M 170 224 V 196"/>
  </g>
  <g fill="#3B4A6B">
    <circle cx="20" cy="78" r="5"/>
    <circle cx="20" cy="120" r="5"/>
    <circle cx="20" cy="162" r="5"/>
    <circle cx="220" cy="78" r="5"/>
    <circle cx="220" cy="120" r="5"/>
    <circle cx="220" cy="162" r="5"/>
    <circle cx="70" cy="224" r="5"/>
    <circle cx="170" cy="224" r="5"/>
  </g>

  <!-- shield -->
  <path d="M 120 34
           C 138 46 166 54 190 56
           C 190 108 176 150 120 178
           C 64 150 50 108 50 56
           C 74 54 102 46 120 34 Z"
        fill="#101A2E" stroke="url(#shieldStroke)" stroke-width="7" stroke-linejoin="round"/>

  <!-- inner shield accent -->
  <path d="M 120 48
           C 135 58 158 64 178 66
           C 178 108 166 140 120 164
           C 74 140 62 108 62 66
           C 82 64 105 58 120 48 Z"
        fill="none" stroke="#1C2A47" stroke-width="3"/>

  <!-- keyhole -->
  <circle cx="120" cy="102" r="17" fill="url(#keyhole)"/>
  <path d="M 112 113 L 128 113 L 133 146 L 107 146 Z" fill="url(#keyhole)"/>

  <!-- base glow line -->
  <path d="M 84 196 H 156" stroke="url(#shieldStroke)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
</svg>
